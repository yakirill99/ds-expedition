data:
  sites_dir: data/rebuilt
  labels_file: labels.geojson
  channels:
  - dtm
  - slope
  - aspect_sin
  - aspect_cos
  - hillshade_az_45
  - hillshade_az_135
  - hillshade_az_225
  - hillshade_az_315
  - slrm_sigma_2.0
  - slrm_sigma_8.0
  - slrm_sigma_32.0
  - positive_openness
  - negative_openness
  - sky_view_factor
  - curvature_sigma_2.0
  - curvature_sigma_8.0
  - tpi_radius_5
  - tpi_radius_15
  - tri_radius_3
  - tri_radius_9
  - point_density
  - mean_intensity
  - std_intensity
  - non_first_return_ratio
  - mean_return_number
  - mean_z
  - z_std
  - rgb_r
  - rgb_g
  - rgb_b
  - mag
  normalize: site_robust
  labels_crs: EPSG:3857
targets:
  classes:
  - kurgany_tselye
  - kurgany_povrezhdennye
  - gorodishcha
  - fortifikatsii
  - arkhitektury
  - finds_points
  - object_poly
  heatmap_sigma_px: 3.0
tiles:
  tile_px: 512
  overlap_px: 128
  pos_fraction: 0.7
model:
  arch: unet
  encoder: resnet34
  prior_prob: 0.01
loss:
  seg_weight: 1.0
  hm_weight: 1.0
  dice_weight: 0.5
  focal_weight: 0.5
  hm_min_norm: 2000.0
stitch:
  window: hann
  eps: 0.001
post:
  seg_thr: 0.5
  min_area_px: 16
  simplify_px: 0.5
  hm_thr: 0.15
  peak_window_px: 7
  point_radius_px: 4.0
  point_vertices: 16
  nms_radius_px: 4.0
  max_detections: 2000
  branches:
    kurgany_tselye: polygon
    kurgany_povrezhdennye: polygon
    gorodishcha: polygon
    fortifikatsii: polygon
    arkhitektury: polygon
    finds_points: point
    object_poly: polygon
eval:
  iou_thr: 0.5
  r_tol: 15.0
  r_tol_units: crs
  iou_samples: 128
  class_agnostic: false
train:
  epochs: 40
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  amp: true
  device: auto
  num_workers: 8
  seed: 0
  tiles_per_epoch: 1024
  train_sites:
  - 001_Гнёздово_Нивленское
  - 002_Тешилово
  - 003_Лубно
  - 006_Осечки_1.1км
  - 007_Армиево
  - 010_Эсбю_укрепление
  - 011_Эрентуна
  - 013_Нора_Виннон
  - 015_Демидовка
  - 016_Хога
  - 018_Курган_Хога
  - 019_Селяне
  - 021_Новенькое
  - 022_Лихуша
  - 023_Бервенец
  - 026_Золотаревка
  - 027_Вышегжа_1
  - 028_Вышегжа_2
  - 030_Эсбю
  - 032_Красносельская_0.5км
  - 034_Усть_река
  - 038_Копанское
  - 040_Примаки_1.3км
  - 041_Миловидово
  - 061_Граборг
  - 068_Стеклянуха_1
  - 106_Верхмарево
  - 179_Гнёздово_Лесная_1
  - 180_Гнёздово_Лесная_2
  - 181_Гнёздово_Лесная_3
  - 182_Красносельская_1.7км
  - 186_Семибратнее_1
  - 189_Макеево
  - 191_Осечки_1.3км
  - 192_КЧР
  val_sites:
  - 004_Боровичи_1
  - 005_Боровичи_2
  - 009_Хальвасборген
  - 031_Новотитаровская
  - 035_Шумгора
  - 037_Никола_Ленивец
  - 044_Новотитаровская_1.8км
  - 045_Новотитаровская_2.8км
  - 104_Шетнево
  runs_dir: runs
  augment:
    hflip_p: 0.5
    vflip_p: 0.5
    rot90_p: 0.5
    channel_dropout_p: 0.1
layers:
- name: dtm
  group: relief
  glob: dtm.tif
  kind: raster
  optional: false
- name: hillshade
  group: relief
  glob: hillshade*.tif
  kind: raster
  optional: true
- name: rgb
  group: optic
  glob: rgb*.tif
  kind: raster
  optional: true
- name: mag
  group: geo
  glob: mag*.tif
  kind: raster
  optional: true
- name: gpr_slice
  group: geo
  glob: gpr*.tif
  kind: raster
  optional: true
