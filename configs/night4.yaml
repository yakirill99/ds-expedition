data:
  sites_dir: data/raw
  labels_file: labels.geojson
  channels:
  - dtm
  - slope
  - aspect_sin
  - aspect_cos
  - hillshade_az_45
  - hillshade_az_135
  - hillshade_az_225
  - hillshade_az_315
  - slrm_sigma_2.0
  - slrm_sigma_8.0
  - slrm_sigma_32.0
  - positive_openness
  - negative_openness
  - sky_view_factor
  - curvature_sigma_2.0
  - curvature_sigma_8.0
  - tpi_radius_5
  - tpi_radius_15
  - tri_radius_3
  - tri_radius_9
  - point_density
  - mean_intensity
  - std_intensity
  - non_first_return_ratio
  - mean_return_number
  - mean_z
  - z_std
  - rgb_r
  - rgb_g
  - rgb_b
  - mag
  normalize: site_robust
  labels_crs: EPSG:3857
targets:
  classes:
  - kurgany_tselye
  - kurgany_povrezhdennye
  - gorodishcha
  - fortifikatsii
  - arkhitektury
  - finds_points
  - object_poly
  heatmap_sigma_px: 3.0
tiles:
  tile_px: 512
  overlap_px: 128
  pos_fraction: 0.7
model:
  arch: unet
  encoder: resnet34
  prior_prob: 0.05
loss:
  seg_weight: 1.0
  hm_weight: 0.3
  dice_weight: 0.5
  focal_weight: 0.5
  hm_min_norm: 2000.0
  focal_alpha: 0.75
stitch:
  window: hann
  eps: 0.001
post:
  seg_thr: 0.5
  split_touching: true
  split_min_distance_px: 3
  min_area_px: 6
  simplify_px: 0.5
  hm_thr: 0.15
  peak_window_px: 7
  point_radius_px: 4.0
  point_vertices: 16
  nms_radius_px: 4.0
  point_nms_radius_px: 1.5
  point_peak_window_px: 3
  max_detections: 2000
  branches:
    kurgany_tselye: both
    kurgany_povrezhdennye: both
    gorodishcha: both
    fortifikatsii: both
    arkhitektury: both
    finds_points: point
    object_poly: both
eval:
  iou_thr: 0.5
  r_tol: 15.0
  r_tol_units: crs
  iou_samples: 128
  class_agnostic: false
  match_mode: coverage
  ignore_offgrid: true
train:
  epochs: 60
  patience: 12
  oracle_gate: 0.95
  checkpoint_key: f1
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  device: auto
  num_workers: 8
  seed: 0
  tiles_per_epoch: 1024
  train_sites:
