# ============================================================
# Конфиг датасета Raleigh (тестовый, разреженный лидар)
# ============================================================
# ВАЖНО: это тестовый датасет для отладки инфраструктуры.
# Плотность 0.0145 точек/м² — недостаточно для реального поиска
# курганов. Для качества нужен плотный лидар (AHN, 3DEP и т.п.).
# ============================================================


# ------------------------------------------------------------
# Датасет: имя, папки, файлы
# ------------------------------------------------------------
dataset:
  # Имя датасета. Используется в логах и в именах выходных файлов.
  name: raleigh

  # Папка с исходными данными (LAS/LAZ, GeoTIFF и т.п.).
  # Относительный путь от корня проекта.
  raw_dir: data/raw

  # Папка для кэша и выходных слоёв.
  # Внутри будут подпапки: layers/ — сохранённые растры.
  cache_dir: data/cache

  # Имя файла лидара внутри raw_dir.
  # Поддерживаются LAS и LAZ.
  lidar_file: lidar_raleigh_nc_spm_height_feet.laz


# ------------------------------------------------------------
# Параметры чтения лидара
# ------------------------------------------------------------
lidar:
  # Единица измерения высоты (Z) в исходном файле.
  # В Raleigh — футы (см. имя файла). Стандартные LAS обычно в метрах.
  # Влияет на: перевод Z в метры при чтении.
  source_z_unit: feet

  # Целевая единица высоты после чтения.
  # Все внутренние расчёты — в метрах.
  target_z_unit: meters

  # Единица измерения горизонтальных координат (X, Y) в файле.
  # В Raleigh — метры (EPSG:3358 определён в метрах).
  # Влияет на: конвертацию XY перед перепроецированием.
  source_xy_unit: meters

  # Размер чанка при чтении LAS, точек.
  # Влияет на: потребление памяти при чтении.
  # Меньше — меньше памяти, но больше накладных расходов.
  # 1 000 000 — компромисс для 12 ГБ RAM.
  chunk_size: 1000000

  # Ограничение общего числа точек (null = без ограничения).
  # Влияет на: скорость отладки, полноту данных.
  # Для тестов ставь 200000–500000, для реальной работы — null.
  max_points: null


# ------------------------------------------------------------
# Системы координат (CRS)
# ------------------------------------------------------------
crs:
  # CRS исходных данных.
  # В Raleigh — EPSG:3358 (NAD83 / North Carolina, метры).
  # Если в LAS есть CRS — он имеет приоритет над этим значением.
  # Влияет на: перепроецирование X, Y при чтении.
  source: EPSG:3358

  # CRS для внутренних расчётов.
  # Должен быть метрическим (метры), чтобы расстояния и площади
  # считались корректно.
  # EPSG:32617 — UTM zone 17N, покрывает Северную Каролину.
  # Влияет на: DTM, рельеф, cloud features — всё в этом CRS.
  internal: EPSG:32617

  # CRS для выходных GeoJSON (по регламенту конкурса).
  # EPSG:3857 — Web Mercator.
  # Влияет на: только на финальный экспорт (роль 3).
  output: EPSG:3857


# ------------------------------------------------------------
# Общая растровая сетка
# ------------------------------------------------------------
grid:
  # Размер пикселя в метрах.
  # Влияет на:
  #   - разрешение DTM и всех производных;
  #   - размер сетки (width × height);
  #   - потребление памяти;
  #   - детализацию объектов.
  # 1.0 м — стандарт для археологии (курганы 10–30 м видны).
  # 5.0 м — компромисс для разреженных данных (Raleigh).
  # 0.5 м — для плотного лидара (AHN, 10+ точек/м²).
  pixel_size: 5.0

  # Значение "нет данных" в растрах.
  # Влияет на: заполнение пустых ячеек, маскирование.
  # Стандарт GDAL — -9999.0.
  nodata: -9999.0


# ------------------------------------------------------------
# Логирование
# ------------------------------------------------------------
logging:
  # Уровень логирования: DEBUG, INFO, WARNING, ERROR.
  # DEBUG — подробно (для отладки), INFO — стандарт.
  level: INFO

  # Формат строки лога.
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

  # Формат даты/времени.
  datefmt: "%Y-%m-%d %H:%M:%S"

  # Файл для логов. Пишется параллельно с консолью.
  log_file: logs/las.log


# ------------------------------------------------------------
# Фильтр земли (отделение земли от растительности и зданий)
# ------------------------------------------------------------
ground:
  # Размер ячейки внутренней сетки для морфологии, метры.
  # Влияет на: точность отделения земли.
  # Меньше — точнее, но медленнее. 1.0 м — стандарт.
  cell_size: 1.0

  # Пресет: strict или soft.
  #   strict — агрессивно убирает всё выше поверхности.
  #            Хорош для равнин без курганов.
  #   soft   — сохраняет крупные положительные формы (насыпи, курганы).
  #            Хорош для археологии.
  # Влияет на: переопределяет height_threshold, slope_threshold,
  #            max_iterations, window_sizes.
  preset: soft

  # Размеры окон прогрессивного морфологического открытия, пиксели.
  # Растут итеративно. Большие окна убирают крупные объекты.
  # Влияет на: сколько растительности отбрасывается.
  # Пресет soft переопределяет это значение.
  window_sizes: [3, 5, 7, 9, 11]

  # Порог по высоте: Z точки - Z поверхности <= этого значения.
  # Влияет на: сколько точек считается землёй.
  # Меньше — строже (меньше земли). Больше — мягче.
  # Пресет soft переопределяет.
  height_threshold: 0.5

  # Порог по наклону поверхности в ячейке.
  # Влияет на: отбрасывание точек на крутых склонах.
  # Пресет soft переопределяет.
  slope_threshold: 0.2

  # Максимум итераций досыпания точек.
  # Влияет на: точность и время.
  # Пресет soft переопределяет.
  max_iterations: 5

  # Минимальная доля изменения маски для остановки итераций.
  # Влияет на: когда считаем, что стабилизировались.
  min_change_ratio: 0.001


# ------------------------------------------------------------
# Построение DTM (Digital Terrain Model)
# ------------------------------------------------------------
dtm:
  # Статистика по ячейке: mean, min, median.
  # Влияет на: высоту DTM в ячейке.
  #   mean   — среднее (может завышать при остатках растительности);
  #   min    — минимум (занижает при шуме);
  #   median — устойчив, но медленный.
  statistic: mean

  # Метод заполнения дыр: idw, nearest.
  # Влияет на: как заполняются ячейки без точек.
  #   idw     — обратные взвешенные расстояния (гладко);
  #   nearest — ближайший сосед (быстро, но ступеньки).
  fill_method: idw

  # Число соседей для IDW.
  # Влияет на: гладкость заполнения. Больше — глаже, но медленнее.
  idw_k: 8

  # Степень расстояния для IDW.
  # Влияет на: насколько сильно дальние соседи влияют.
  # 2.0 — стандарт.
  idw_power: 2.0

  # Максимальный размер дыры в пикселях.
  # Дыры больше этого — не заполняем, оставляем nodata.
  # Влияет на: сколько выдуманных высот появится в DTM.
  # Лучше nodata, чем выдумка.
  max_hole_pixels: 1000

  # Размер окна для детектора артефактов (пиксели).
  # Влияет на: какие скачки считаются артефактами.
  artifact_window: 5

  # Порог для детектора артефактов (метры).
  # Разница с медианой окна > порога = артефакт.
  artifact_threshold: 2.0


# ------------------------------------------------------------
# Производные рельефа
# ------------------------------------------------------------
relief:
  # Азимуты солнца для hillshade, градусы.
  # Несколько — чтобы курганы были видны при любом направлении валов.
  # Влияет на: число слоёв hillshade_az_*.
  # 4 азимута (45/135/225/315) покрывают все направления.
  hillshade_azimuths: [45, 135]

  # Высота солнца над горизонтом, градусы.
  # Влияет на: контраст hillshade. 45° — стандарт.
  hillshade_altitude: 45.0

  # Вертикальное преувеличение рельефа для hillshade.
  # Влияет на: видимость мелких форм. 1.0 — без преувеличения.
  hillshade_z_factor: 1.0

  # Масштабы SLRM (сигма гауссова размытия, пиксели).
  # SLRM = DTM - gaussian_blur(DTM, sigma).
  # Влияет на: какие масштабы объектов ловим.
  #   σ=2  — объекты 4–6 м;
  #   σ=8  — 16–25 м (курганы);
  #   σ=32 — 60–100 м (крупные валы).
  slrm_sigmas: [8.0]

  # Радиус для openness и sky-view factor, пиксели.
  # Влияет на: дальность обзора. Больше — видит дальше, но медленнее.
  # Для теста 3, для реальной работы 10–20.
  openness_radius: 3

  # Число направлений для openness.
  # Влияет на: точность. 16 — стандарт. 4 — быстро для теста.
  openness_n_directions: 4

  # Радиусы для кривизны (сигма размытия перед второй производной).
  # Влияет на: чувствительность к шуму. Больше σ — глаже.
  curvature_sigmas: [2.0]

  # Радиусы для TPI (Topographic Position Index), пиксели.
  # TPI = DTM - mean(DTM в окне радиуса).
  # Влияет на: масштаб локальных форм.
  tpi_radii: [5]

  # Радиусы для TRI (Terrain Ruggedness Index), пиксели.
  # TRI = std(DTM в окне).
  # Влияет на: масштаб "шероховатости".
  tri_radii: [3]


# ------------------------------------------------------------
# Растровые признаки из облака точек
# ------------------------------------------------------------
cloud_features:
  # Какие признаки считать.
  # Влияет на: число каналов для модели.
  # Можно включать/выключать по одному.
  enabled:
    - point_density
    - mean_intensity
    - std_intensity
    - non_first_return_ratio
    - mean_return_number
    - mean_z
    - z_std

  # Нодата для растров признаков.
  nodata: -9999.0


# ------------------------------------------------------------
# Выравнивание слоёв (ресэмплинг, проверка сдвига)
# ------------------------------------------------------------
align:
  # Метод ресэмплинга по умолчанию: bilinear, nearest, cubic, average.
  # Влияет на: как слои приводятся к общей сетке.
  #   bilinear — для непрерывных (DTM, интенсивность);
  #   nearest  — для категориальных (классы);
  #   average  — для плотностей.
  default_method: bilinear

  # Максимальный сдвиг для поиска, пиксели.
  # Ищем в окне [-max_shift, +max_shift].
  # Влияет на: диапазон возможных сдвигов.
  max_shift: 5

  # Порог NCC (нормированной кросс-корреляции).
  # Пик выше порога — сдвиг надёжен.
  # NCC в [-1, 1]. Для коррелированных слоёв 0.5–0.9. Для шума 0.05–0.15.
  confidence_threshold: 0.3
