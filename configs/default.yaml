# Общий конфиг пайплайна Data/Geo.
# Значения dataset/crs/lidar подставляются автоматически
# из папки участка. Остальное — единое для всех.

dataset:
  name: null
  raw_dir: null
  cache_dir: null
  lidar_file: null

lidar:
  source_z_unit: null
  target_z_unit: meters
  source_xy_unit: meters
  chunk_size: 1000000
  max_points: null

crs:
  source: null
  internal: null
  output: EPSG:3857

grid:
  pixel_size: 1.0
  nodata: -9999.0

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  log_file: null

ground:
  cell_size: 1.0
  preset: soft
  window_sizes: [3, 5, 7, 9, 11]
  height_threshold: 0.5
  slope_threshold: 0.2
  max_iterations: 5
  min_change_ratio: 0.001

dtm:
  statistic: mean
  fill_method: idw
  idw_k: 8
  idw_power: 2.0
  max_hole_pixels: 1000
  artifact_window: 5
  artifact_threshold: 2.0

relief:
  hillshade_azimuths: [45, 135, 225, 315]
  hillshade_altitude: 45.0
  hillshade_z_factor: 1.0
  slrm_sigmas: [2.0, 8.0, 32.0]
  openness_radius: 10
  openness_n_directions: 16
  curvature_sigmas: [2.0, 8.0]
  tpi_radii: [5, 15]
  tri_radii: [3, 9]

cloud_features:
  enabled:
    - point_density
    - mean_intensity
    - std_intensity
    - non_first_return_ratio
    - mean_return_number
    - mean_z
    - z_std
  nodata: -9999.0

align:
  default_method: bilinear
  max_shift: 5
  confidence_threshold: 0.3

# Спектральные индексы для оптики (NDVI, SR, ARI, GNDVI, NDWI).
# Индексы каналов 0-based. Если nir_channel=null — NDVI/SR не строятся
# (graceful skip для grayscale-снимков, где NIR физически отсутствует).
spectral:
  enabled: [ndvi, sr, ari, gndvi, ndwi]
  red_channel: 0
  nir_channel: 3
  green_channel: 1
  blue_channel: 2
  nodata: -9999.0

# Управление модальностями участка.
# enabled — какие обрабатывать (li=лидар, or/sp_or/ae=оптика,
# maggr/etgr/terfl=геофизика).
# priority — порядок для выбора целевой сетки, если лидара нет.
modalities:
  enabled: [li, or, sp_or, ae, maggr, etgr, terfl]
  priority: [li, or, sp_or, ae, maggr, etgr, terfl]

# Экспорт в выходной CRS (EPSG:3857 по регламенту).
# enabled=false по умолчанию: слои для модели живут в internal UTM
# (метры), 3857 применяется только на границе векторизации/сабмита.
output_crs:
  enabled: false
  epsg: EPSG:3857
